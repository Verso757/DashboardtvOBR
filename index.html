<!DOCTYPE html>
<html lang="es" class="h-full w-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" id="app-favicon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Yaqui - Tablero Operativo y Bitácora de Rutas</title>
    <meta name="description" content="Tablero de monitoreo de rutas, visitas, litros y bitácora en tiempo real para pantallas y Smart TV." />
    <meta property="og:title" content="Yaqui - Tablero Operativo y Bitácora de Rutas" />
    <meta property="og:description" content="Tablero de monitoreo de rutas, visitas, litros y bitácora en tiempo real para pantallas y Smart TV." />
    
    <!-- Dynamic Favicon Fallback -->
    <script>
      (function() {
        var fav = document.getElementById('app-favicon');
        var testImg = new Image();
        testImg.onload = function() {
          fav.href = '/logo.png';
        };
        testImg.onerror = function() {
          fav.href = '/logo-yaqui.svg';
        };
        testImg.src = '/logo.png';
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-100 text-slate-800 overflow-hidden m-0 p-0 w-full h-full antialiased selection:bg-blue-600 selection:text-white">
    <div id="root" class="w-full h-full flex flex-col overflow-hidden"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
